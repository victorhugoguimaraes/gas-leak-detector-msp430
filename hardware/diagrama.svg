<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"
     role="img" aria-labelledby="tituloDiagrama descDiagrama">
  <title id="tituloDiagrama">Diagrama de ligação — Detector de vazamento de gás com MSP430F5529LP</title>
  <desc id="descDiagrama">
    Diagrama de blocos com a LaunchPad MSP430F5529LP ao centro e os periféricos: sensor MQ-2 com divisor
    resistivo na entrada analógica A0/P6.0; LCD 16x2 I2C nos pinos P3.0/SDA e P3.1/SCL; buzzer acionado por
    transistor NPN no pino P2.4/TA2.1; LED1 no pino P1.0; botão S2 no pino P2.1 com interrupção de porta.
  </desc>

  <defs>
    <!-- Setas de 12 px, independentes da espessura do traço -->
    <marker id="setaCiano" viewBox="0 0 12 12" refX="10.5" refY="6" markerUnits="userSpaceOnUse"
            markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4cc9f0"/>
    </marker>
    <marker id="setaAmbar" viewBox="0 0 12 12" refX="10.5" refY="6" markerUnits="userSpaceOnUse"
            markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffb703"/>
    </marker>
    <marker id="setaVerde" viewBox="0 0 12 12" refX="10.5" refY="6" markerUnits="userSpaceOnUse"
            markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3ddc97"/>
    </marker>
    <marker id="setaRoxaFim" viewBox="0 0 12 12" refX="10.5" refY="6" markerUnits="userSpaceOnUse"
            markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#b28dff"/>
    </marker>
    <!-- Variante invertida, usada no início de linhas bidirecionais -->
    <marker id="setaRoxaIni" viewBox="0 0 12 12" refX="1.5" refY="6" markerUnits="userSpaceOnUse"
            markerWidth="12" markerHeight="12" orient="auto">
      <path d="M12,0 L0,6 L12,12 z" fill="#b28dff"/>
    </marker>
    <marker id="setaVermelha" viewBox="0 0 12 12" refX="10.5" refY="6" markerUnits="userSpaceOnUse"
            markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ef476f"/>
    </marker>

    <style>
      .fonte     { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .titulo    { font-size: 25px; font-weight: 700; fill: #e8f4f8; }
      .subtitulo { font-size: 13px; fill: #9fb8c4; }
      .blocoTxt  { font-size: 17px; font-weight: 700; }
      .blocoSub  { font-size: 12px; fill: #9fb8c4; }
      .pino      { font-size: 13px; font-weight: 600; fill: #dff3f9; font-family: Consolas, monospace; }
      .pinoFn    { font-size: 12.5px; fill: #9fb8c4; }
      .rotulo    { font-size: 12px; fill: #cfe6ee; }
      .legenda   { font-size: 12.5px; fill: #cfe6ee; }
      .nota      { font-size: 11.5px; fill: #8aa8b6; }
      .caixaInt  { fill: #123040; stroke-width: 2; }
      .sinal     { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .alim      { fill: none; stroke: #ef476f; stroke-width: 2; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <!-- Fundo -->
  <rect x="0" y="0" width="1200" height="900" fill="#0b1f2a"/>

  <!-- Cabeçalho -->
  <text class="fonte titulo" x="60" y="44">Detector de Vazamento de Gás — MSP430F5529LP</text>
  <text class="fonte subtitulo" x="60" y="70">Diagrama de ligação · firmware default · Laboratório de Sistemas Microprocessados — UnB</text>

  <!-- Barramento de alimentação -->
  <path class="alim" d="M600,300 L600,96 L210,96 L210,110"/>
  <path class="alim" d="M600,96 L990,96 L990,110" marker-end="url(#setaVermelha)"/>
  <text class="fonte nota" x="600" y="88" text-anchor="middle">Barramento de alimentação 3,3 V / 5 V (USB) e GND comum</text>

  <!-- ===================== LaunchPad (centro) ===================== -->
  <rect class="caixaInt" x="420" y="300" width="360" height="260" rx="16" stroke="#2f6f8a"/>
  <text class="fonte blocoTxt" x="600" y="334" text-anchor="middle" fill="#4cc9f0">LaunchPad MSP430F5529LP</text>
  <line x1="436" y1="350" x2="764" y2="350" stroke="#2f6f8a" stroke-width="1.5"/>

  <circle cx="433" cy="379" r="3.5" fill="#4cc9f0"/>
  <text class="fonte pino" x="448" y="388">P6.0 / A0</text>
  <text class="fonte pinoFn" x="762" y="388" text-anchor="end">ADC12 ← MQ-2</text>

  <circle cx="433" cy="409" r="3.5" fill="#ffb703"/>
  <text class="fonte pino" x="448" y="418">P1.0</text>
  <text class="fonte pinoFn" x="762" y="418" text-anchor="end">LED1 — alerta visual</text>

  <circle cx="433" cy="439" r="3.5" fill="#ef476f"/>
  <text class="fonte pino" x="448" y="448">P2.4</text>
  <text class="fonte pinoFn" x="762" y="448" text-anchor="end">Buzzer — PWM (Timer A2, ≈1 kHz)</text>

  <circle cx="433" cy="469" r="3.5" fill="#3ddc97"/>
  <text class="fonte pino" x="448" y="478">P2.1</text>
  <text class="fonte pinoFn" x="762" y="478" text-anchor="end">Botão S2 — IRQ (P2IV = 0x04)</text>

  <circle cx="433" cy="499" r="3.5" fill="#b28dff"/>
  <text class="fonte pino" x="448" y="508">P3.0 / P3.1</text>
  <text class="fonte pinoFn" x="762" y="508" text-anchor="end">I²C — SDA / SCL</text>

  <circle cx="433" cy="529" r="3.5" fill="#ef476f"/>
  <text class="fonte pino" x="448" y="538">3V3 · 5V · GND</text>
  <text class="fonte pinoFn" x="762" y="538" text-anchor="end">Alimentação</text>

  <!-- ===================== Sensor MQ-2 ===================== -->
  <rect class="caixaInt" x="60" y="110" width="300" height="150" rx="12" stroke="#4cc9f0"/>
  <text class="fonte blocoTxt" x="210" y="142" text-anchor="middle" fill="#4cc9f0">Sensor MQ-2</text>
  <text class="fonte blocoSub" x="210" y="163" text-anchor="middle">gás inflamável · saída analógica</text>

  <!-- símbolo do sensor: cápsula com malha -->
  <rect x="86" y="180" width="66" height="60" rx="9" fill="#0b1f2a" stroke="#4cc9f0" stroke-width="1.6"/>
  <circle cx="104" cy="198" r="3" fill="#4cc9f0" opacity="0.75"/>
  <circle cx="119" cy="198" r="3" fill="#4cc9f0" opacity="0.75"/>
  <circle cx="134" cy="198" r="3" fill="#4cc9f0" opacity="0.75"/>
  <circle cx="104" cy="213" r="3" fill="#4cc9f0" opacity="0.75"/>
  <circle cx="119" cy="213" r="3" fill="#4cc9f0" opacity="0.75"/>
  <circle cx="134" cy="213" r="3" fill="#4cc9f0" opacity="0.75"/>
  <circle cx="104" cy="228" r="3" fill="#4cc9f0" opacity="0.75"/>
  <circle cx="119" cy="228" r="3" fill="#4cc9f0" opacity="0.75"/>
  <circle cx="134" cy="228" r="3" fill="#4cc9f0" opacity="0.75"/>

  <text class="fonte rotulo" x="172" y="196">VCC — 5 V (ou 3,3 V)</text>
  <text class="fonte rotulo" x="172" y="218">GND — comum</text>
  <text class="fonte rotulo" x="172" y="240">AOUT — analógico</text>
  <line class="sinal" x1="300" y1="236" x2="360" y2="236" stroke="#4cc9f0"/>

  <!-- ===================== Divisor resistivo ===================== -->
  <rect x="250" y="290" width="180" height="64" rx="10" fill="#0b1f2a" stroke="#4cc9f0"
        stroke-width="1.6" stroke-dasharray="6 5"/>
  <text class="fonte rotulo" x="340" y="314" text-anchor="middle" fill="#4cc9f0">Divisor 10 kΩ / 18 kΩ</text>
  <text class="fonte nota" x="340" y="334" text-anchor="middle">5 V → 3,21 V (máx. 3,3 V)</text>
  <path class="sinal" d="M360,236 L392,236 L392,290" stroke="#4cc9f0"/>
  <path class="sinal" d="M340,354 L340,382 L414,382" stroke="#4cc9f0" marker-end="url(#setaCiano)"/>
  <text class="fonte nota" x="384" y="374">A0</text>

  <!-- ===================== LCD 16x2 I²C ===================== -->
  <rect class="caixaInt" x="840" y="110" width="300" height="150" rx="12" stroke="#b28dff"/>
  <text class="fonte blocoTxt" x="990" y="142" text-anchor="middle" fill="#b28dff">LCD 16x2 (I²C)</text>
  <text class="fonte blocoSub" x="990" y="163" text-anchor="middle">2 linhas × 16 caracteres</text>
  <rect x="866" y="178" width="248" height="52" rx="8" fill="#0b1f2a" stroke="#b28dff" stroke-width="1.6"/>
  <text class="fonte nota" x="878" y="199">Nivel Gas: 1234</text>
  <text class="fonte nota" x="878" y="221">Ambiente Seguro</text>
  <text class="fonte nota" x="990" y="248" text-anchor="middle">alarme: ALERTA DE GAS! · mute: ALERTA (MUTADO)</text>

  <!-- I²C bidirecional -->
  <path class="sinal" d="M840,232 L800,232 L800,502 L786,502" stroke="#b28dff"
        marker-start="url(#setaRoxaIni)" marker-end="url(#setaRoxaFim)"/>
  <text class="fonte nota" x="794" y="254" text-anchor="end">SDA (P3.0)</text>
  <text class="fonte nota" x="794" y="270" text-anchor="end">SCL (P3.1)</text>

  <!-- ===================== LED1 ===================== -->
  <rect class="caixaInt" x="60" y="540" width="280" height="140" rx="12" stroke="#ffb703"/>
  <text class="fonte blocoTxt" x="200" y="572" text-anchor="middle" fill="#ffb703">LED1 (na placa)</text>
  <text class="fonte blocoSub" x="200" y="590" text-anchor="middle">alerta visual — P1.0 (previsto)</text>

  <!-- símbolo do LED -->
  <line x1="112" y1="646" x2="140" y2="646" stroke="#ffb703" stroke-width="2.5"/>
  <path d="M140,628 L140,664 L170,646 z" fill="none" stroke="#ffb703" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="170" y1="628" x2="170" y2="664" stroke="#ffb703" stroke-width="2.5"/>
  <line x1="170" y1="646" x2="212" y2="646" stroke="#ffb703" stroke-width="2.5"/>
  <path d="M146,622 L158,606" stroke="#ffb703" stroke-width="2" marker-end="url(#setaAmbar)"/>
  <path d="M162,626 L174,610" stroke="#ffb703" stroke-width="2" marker-end="url(#setaAmbar)"/>
  <text class="fonte nota" x="218" y="650">→ GND</text>

  <path class="sinal" d="M420,408 L390,408 L390,610 L346,610" stroke="#ffb703" marker-end="url(#setaAmbar)"/>
  <text class="fonte nota" x="384" y="440" text-anchor="end">P1.0</text>

  <!-- ===================== Buzzer + transistor NPN ===================== -->
  <rect class="caixaInt" x="840" y="540" width="300" height="140" rx="12" stroke="#ef476f"/>
  <text class="fonte blocoTxt" x="990" y="566" text-anchor="middle" fill="#ef476f">Buzzer + transistor NPN</text>
  <text class="fonte blocoSub" x="990" y="586" text-anchor="middle">alerta sonoro ≈ 1 kHz (PWM)</text>

  <!-- transistor NPN -->
  <circle cx="920" cy="626" r="22" fill="none" stroke="#ef476f" stroke-width="2"/>
  <line x1="908" y1="610" x2="908" y2="642" stroke="#ef476f" stroke-width="3"/>
  <line x1="884" y1="626" x2="908" y2="626" stroke="#ef476f" stroke-width="2.5"/>
  <line x1="908" y1="616" x2="936" y2="602" stroke="#ef476f" stroke-width="2.5"/>
  <line x1="908" y1="636" x2="936" y2="650" stroke="#ef476f" stroke-width="2.5"/>
  <path d="M936,650 L923,649 L927,640 z" fill="#ef476f"/>

  <!-- coletor → buzzer -->
  <path class="sinal" d="M936,602 L970,602 L970,626 L1008,626" stroke="#ef476f" marker-end="url(#setaVermelha)"/>
  <!-- emissor → GND -->
  <path class="sinal" d="M936,650 L970,650 L970,662 L984,662" stroke="#ef476f"/>
  <line x1="970" y1="662" x2="994" y2="662" stroke="#ef476f" stroke-width="2.5"/>
  <line x1="974" y1="668" x2="990" y2="668" stroke="#ef476f" stroke-width="2.5"/>
  <line x1="978" y1="674" x2="986" y2="674" stroke="#ef476f" stroke-width="2.5"/>
  <text class="fonte nota" x="1000" y="670">GND</text>

  <!-- símbolo do buzzer -->
  <rect x="1010" y="606" width="98" height="40" rx="8" fill="#0b1f2a" stroke="#ef476f" stroke-width="1.8"/>
  <text class="fonte rotulo" x="1059" y="624" text-anchor="middle">Buzzer</text>
  <text class="fonte nota" x="1059" y="640" text-anchor="middle">1 kHz</text>
  <!-- buzzer → VCC -->
  <path class="sinal" d="M1108,626 L1122,626 L1122,600" stroke="#ef476f"/>
  <line x1="1110" y1="598" x2="1134" y2="598" stroke="#ef476f" stroke-width="2.5"/>
  <text class="fonte nota" x="1134" y="590" text-anchor="end">VCC</text>

  <path class="sinal" d="M780,442 L812,442 L812,626 L884,626" stroke="#ef476f" marker-end="url(#setaVermelha)"/>
  <text class="fonte nota" x="818" y="466">P2.4 / TA2.1</text>

  <!-- ===================== Botão S2 ===================== -->
  <rect class="caixaInt" x="450" y="630" width="300" height="130" rx="12" stroke="#3ddc97"/>
  <text class="fonte blocoTxt" x="600" y="662" text-anchor="middle" fill="#3ddc97">Botão S2 — P2IV = 0x04</text>
  <text class="fonte blocoSub" x="600" y="683" text-anchor="middle">entrada com pull-up · debounce 20 ms</text>

  <!-- símbolo do botão -->
  <line x1="516" y1="726" x2="556" y2="726" stroke="#3ddc97" stroke-width="2.5"/>
  <line x1="644" y1="726" x2="684" y2="726" stroke="#3ddc97" stroke-width="2.5"/>
  <circle cx="560" cy="726" r="4" fill="#3ddc97"/>
  <circle cx="640" cy="726" r="4" fill="#3ddc97"/>
  <line x1="560" y1="712" x2="640" y2="712" stroke="#3ddc97" stroke-width="2.5"/>
  <line x1="600" y1="712" x2="600" y2="700" stroke="#3ddc97" stroke-width="2.5"/>
  <text class="fonte nota" x="600" y="750" text-anchor="middle">P2.1 → GND quando pressionado</text>

  <path class="sinal" d="M600,630 L600,566" stroke="#3ddc97" marker-end="url(#setaVerde)"/>
  <text class="fonte nota" x="606" y="606">P2.1</text>

  <!-- ===================== Legenda ===================== -->
  <rect x="60" y="780" width="1080" height="100" rx="12" fill="#0e2634" stroke="#1f4b5e" stroke-width="1.5"/>
  <text class="fonte blocoTxt" x="80" y="806" font-size="13" fill="#cfe6ee">Legenda</text>

  <line class="sinal" x1="80" y1="838" x2="112" y2="838" stroke="#4cc9f0" marker-end="url(#setaCiano)"/>
  <text class="fonte legenda" x="122" y="843">ADC — sinal analógico</text>

  <line class="sinal" x1="300" y1="838" x2="332" y2="838" stroke="#ffb703" marker-end="url(#setaAmbar)"/>
  <text class="fonte legenda" x="342" y="843">Saída digital / PWM</text>

  <line class="sinal" x1="510" y1="838" x2="542" y2="838" stroke="#3ddc97" marker-end="url(#setaVerde)"/>
  <text class="fonte legenda" x="552" y="843">Entrada (botão)</text>

  <line class="sinal" x1="690" y1="838" x2="722" y2="838" stroke="#b28dff"
        marker-start="url(#setaRoxaIni)" marker-end="url(#setaRoxaFim)"/>
  <text class="fonte legenda" x="732" y="843">I²C (bidirecional)</text>

  <line class="alim" x1="900" y1="838" x2="932" y2="838"/>
  <text class="fonte legenda" x="942" y="843">Alimentação / GND</text>

  <text class="fonte nota" x="80" y="860">Firmware default: buzzer P2.4 (Timer A2) · botão P2.1 (P2IV = 0x04) · LCD I²C 0x27 · divisor 10 kΩ/18 kΩ → 3,21 V</text>
  <text class="fonte nota" x="80" y="876">Limiar 1500 contagens (teórico 2048 ≈ 1,65 V) · buzzer ≈ 1 kHz · debounce 20 ms · leitura a cada ~2 s · base do NPN: R 1 kΩ</text>
</svg>
